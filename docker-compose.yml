services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - markdown-data:/data/markdown
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./web
      args:
        - VITE_API_KEY=${API_KEY}
        - VITE_API_BASE=${VITE_API_BASE:-}
    env_file: .env
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api

  mcp-server:
    build: ./mcp-server
    env_file: .env
    environment:
      - AS_API_BASE=http://api:8000/api/v1
      - AS_API_KEY=${API_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  markdown-data: